name: 功能·语言高亮批次
on:
  workflow_dispatch:

jobs:
  lang_highlight:
    name: "语法高亮与查看器着色 · ${{ matrix.label }}"
    runs-on: ubuntu-latest
    strategy:
      # 单个语言失败不许掐掉整批：五个语言互不相干，掐了就白跑
      fail-fast: false
      matrix:
        include:
          - lang: c
            label: "C（c）"
          - lang: cpp
            label: "C++（cpp）"
          - lang: csharp
            label: "C#（csharp）"
          - lang: javascript
            label: "JavaScript（javascript）"
          - lang: typescript
            label: "TypeScript（typescript）"
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 本仓没有 gradle wrapper（仓库根目录里就没有 gradlew），
      # 第一版直接跑 ./gradlew，五个 job 一起死在 exit 127。
      # AGP 8.7.3 要求 Gradle 8.9 以上，这里固定 8.10.2。
      - name: 装 Gradle 8.10.2
        run: |
          curl -fsSL --retry 3 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: 只跑这个语言那一条测试
        run: gradle :engine:test --tests "com.hualuo.engine.language.LanguageHighlightMatrixTest._${{ matrix.lang }}Case" --stacktrace